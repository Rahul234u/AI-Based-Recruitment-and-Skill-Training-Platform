spring.application.name=RecruitmentAndSkillTrainingPlatform

# Default local profile uses H2 for build/test compatibility.
# Production and MySQL deployments should set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:jobdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT configuration
jwt.secret=${JWT_SECRET:VGhpcyBJcyBBIFJlYWxseSBTdHJvbmcgSldUIEtleSBGb3IgUmVjcnVpdG1lbnQgUGxhdGZvcm0gMjAyNiE=}
jwt.expiration-ms=86400000

# AI configuration
ai.ollama.base-url=${AI_BASE_URL:http://localhost:11434}
ai.ollama.model=${AI_MODEL:llama3.2}
ai.api.key=${AI_API_KEY:}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.majorProject.RecruitmentAndSkillTrainingPlatform=INFO
